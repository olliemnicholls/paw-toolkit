task_name: fiscal_week
spec: 'Label a calendar date with the fiscal week it falls in.


  The fiscal calendar works like this. A fiscal year begins on the first Monday of February and ends on the Sunday before the next fiscal year begins. The fiscal year is named after the calendar year its February start falls in: the fiscal year that begins on the first Monday of February 2026 is fiscal year 2026. Weeks are numbered starting from 1: the seven days beginning on that first Monday of February are week 1, the next seven days are week 2, and so on. Because the fiscal year runs from February to February, a date that falls in January, or in February before that year''s first Monday, belongs to the PREVIOUS fiscal year, and its week number continues that previous year''s count -- so those dates land in the high forties or low fifties. A fiscal year has 52 weeks, or 53 when the extra day pushes it over, so the last week of a fiscal year is week 52 or week 53.


  Note that this is NOT the ISO 8601 week number, which counts from January. A fiscal week number is always the number of whole weeks since the first Monday of February, plus one.


  The input is a single date, written in any of these forms: 2026-03-03, March 3, 2026, 3 Mar 2026, or Tuesday 3 March 2026.


  Output exactly one label and nothing else, in the form FY<year>-W<nn>, where <year> is the four-digit fiscal year and <nn> is the two-digit week number, zero-padded below ten.


  Worked example one. The date is 3 Mar 2026. The first Monday of February 2026 is 2 February 2026, so fiscal year 2026 began that day. 3 March 2026 is 29 days after 2 February 2026. 29 divided by 7 is 4 whole weeks with 1 day left over, so it is in week 4 + 1 = 5. The label is FY2026-W05.


  Worked example two. The date is 2026-01-20. That is in January, so it belongs to the previous fiscal year, 2025. Fiscal year 2025 began on the first Monday of February 2025, which is 3 February 2025. 20 January 2026 is 351 days after 3 February 2025. 351 divided by 7 is 50 whole weeks with 1 day left over, so it is in week 50 + 1 = 51. The label is FY2025-W51.

  '
