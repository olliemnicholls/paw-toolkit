task_name: finetune_triage
spec: Classify a customer support ticket into priority (low, medium, high, or critical), department (billing, technical, sales, or general), and urgency_score (integer 1-5).
adapter_path: measurements/finetune_triage_B-paw-4b-qwen3-0.6b.paw
standard_cases:
- input: 'I was charged twice on my credit card for invoice #INV-9821. Please refund immediately!'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: Our production API gateway is throwing 502 Bad Gateway errors across all regions!
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: We are interested in an enterprise annual contract for 250 seats. Who can we talk to?
  expected: '{"priority": "high", "department": "sales", "urgency_score": 4}'
- input: How do I update my profile picture in the settings page? I can't find the upload button.
  expected: '{"priority": "low", "department": "technical", "urgency_score": 1}'
- input: Database replication lag is exceeding 45 minutes on our primary PostgreSQL cluster.
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: Can you provide a copy of your SOC-2 Type II audit report for our compliance review?
  expected: '{"priority": "medium", "department": "general", "urgency_score": 3}'
- input: My password reset email is never arriving in my inbox or spam folder.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: We need to add 5 more team members to our billing subscription plan.
  expected: '{"priority": "medium", "department": "billing", "urgency_score": 3}'
- input: The iOS app crashes immediately upon opening on iOS 18 beta.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: Thank you for the quick support yesterday, everything is working smoothly now!
  expected: '{"priority": "low", "department": "general", "urgency_score": 1}'
- input: Getting a 403 Forbidden error when calling the /v2/export endpoint since this morning.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: Please cancel my subscription and confirm the final invoice amount.
  expected: '{"priority": "medium", "department": "billing", "urgency_score": 3}'
- input: Is there a discount for non-profit organizations on the enterprise tier?
  expected: '{"priority": "low", "department": "sales", "urgency_score": 1}'
- input: The dashboard chart colors are unreadable in dark mode, can this be fixed?
  expected: '{"priority": "low", "department": "technical", "urgency_score": 2}'
- input: 'Urgent: our webhook deliveries have been failing silently for 3 hours, losing orders.'
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: Just wanted to say the new onboarding flow is much clearer, nice work.
  expected: '{"priority": "low", "department": "general", "urgency_score": 1}'
- input: Requesting a data export of all our account's usage logs for the last 12 months.
  expected: '{"priority": "medium", "department": "technical", "urgency_score": 3}'
- input: Two-factor authentication codes via SMS aren't arriving for EU phone numbers.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: What's the SLA for critical incidents on the enterprise support plan?
  expected: '{"priority": "medium", "department": "general", "urgency_score": 2}'
- input: The billing page shows a negative balance that doesn't match our invoice history.
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: Hi, I'm trying to understand how your real-time dashboard integrates with Salesforce. We're evaluating your platform for our sales team and want to know if there's documentation on the CRM sync capabilities. Thanks.
  expected: '{"priority": "medium", "department": "sales", "urgency_score": 2}'
- input: 'I need to dispute a charge from last month. On February 18th I was billed $1,200 for the Professional tier but I downgraded to Starter on February 10th. The system still charged me the full amount. Please review subscription change order #SUB-789456 and issue a credit.'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: getting an HTTP 502 Bad Gateway error whenever i try to export data to CSV from the Revenue Cohort report. this started happening around 10 AM EST today and ive tried clearing cache/cookies but still broken. workspace ID is analytics-prod-2847. need this fixed ASAP for end of quarter reporting
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: We're migrating our analytics stack and need to transfer data and dashboard ownership from our previous admin sarah.kim@acmecorp.com (user ID U-445821) to our new lead james.wright@acmecorp.com. Can you handle this transfer? We also need to know if we can export our custom metric definitions.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: 'Ordered the premium data connector license pack on 3/29 (Order #DCP-991247) for overnight shipping and it still hasn''t arrived. Tracking shows it left the warehouse on 3/30 but now says "delivery exception" with no update since 4/1. Where is this?'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: CRITICAL SECURITY ISSUE - we detected suspicious activity on our account. someone logged in from IP 185.220.101.x on april 2 at 2:33 AM but none of our team was online. they accessed the 'User Permissions' section and modified API key settings. we have NOT confirmed if any keys were exposed. please disable all active API keys immediately (we have 7 total) and help us audit what was accessed. this is urgent.
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: Just wanted to reach out and say the new version has been rock solid for us. The team loves the improved filtering on the Custom Events dashboard. We're planning to expand to your Enterprise tier soon. Great work on this release.
  expected: '{"priority": "low", "department": "general", "urgency_score": 1}'
- input: 'Hi there, we''re being double-billed for our annual contract. Invoice #INV-204156 (dated Jan 3) charged us $8,500 for the year, but then Invoice #INV-204201 (dated Jan 5) charged another $8,500 for what looks like the same renewal period. We only authorized one payment. Can you clarify what''s happening and reverse one of these charges?'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: Hi, I noticed someone tried to log into my account from India on April 2nd around 3 AM. I'm in Ohio and definitely wasn't traveling. Should I be worried? My account is username 'david_sz1987' and I haven't changed my password in like 2 years so maybe thats the problem?
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: Do you guys sell phone chargers in bulk? Looking to outfit a small office with USB-C cables and wall adapters. What's your minimum order quantity and do you offer any corporate discounts?
  expected: '{"priority": "low", "department": "sales", "urgency_score": 2}'
- input: 'I was charged twice for my order on March 28th - both charges went through as $89.99 for the Anker PowerBank 25000mAh (SKU: ANK-PB25K-BLK). Transaction IDs are TXN-7634921 and TXN-7634922. Please refund one of these immediately.'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: everytime i click on product reviews the page just goes blank??? its been like this for 3 days now. im trying to decide if i should buy the samsung 4k monitor but i cant see what people think about it. using firefox on windows 10. HELP
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: I can't remember the password to my account and when I try to reset it, the email never shows up in my inbox or spam folder. I've tried using both the email address I signed up with (margaret.chen84@gmail.com) and my backup email. This is my first time buying from you guys and I really need to access my account to track my order.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: 'Order #OE-556847 was supposed to arrive yesterday (April 9th) with 2-day shipping. Tracking number shows it''s been stuck in the distribution center in Memphis since April 8th. The package contains a laptop cooling pad I need for work tomorrow. Can you contact the carrier or upgrade my shipping at no charge?'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: 'URGENT SECURITY BREACH: My credit card ending in 4782 was used to make an unauthorized purchase of $247.50 for a graphics card on your site on April 4th at 11:23 PM. I did NOT make this purchase. Order number is OE-889234. My card issuer is disputing the charge but I need this investigated ASAP. Lock my account immediately.'
  expected: '{"priority": "critical", "department": "billing", "urgency_score": 5}'
- input: just wanted to say that the new LED desk lamp (model DL-6500RGB) I ordered last week is absolutely perfect. Works great, arrived early, and the app controls for the color settings are really intuitive. Not many complaints from me!
  expected: '{"priority": "low", "department": "general", "urgency_score": 1}'
- input: 'Hi, I ordered the CloudSync USB adapter (part #CS-2847) on April 2nd with expedited shipping and the tracking number hasn''t updated since April 3rd. It was supposed to arrive yesterday. What''s going on?'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: 'ALERT: I found logins to my account from an IP address in Nigeria on April 18 at 2:34 AM. I''m in Toronto and definitely wasn''t accessing my account then. This is serious - I store sensitive client files here. What do I do???'
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: does your cloud storage work with google workspace or just microsoft? trying to figure out if this will fit our workflow
  expected: '{"priority": "low", "department": "sales", "urgency_score": 2}'
- input: 'I was charged $14.99 on April 15th (invoice #INV-847562) for what I thought was a free trial month. your website said the first month was free but my card was still hit. need this reversed immediately.'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: whenever i try to upload files larger than 500MB the browser just closes. ive tried firefox and chrome and it keeps happening. getting error code UPLOAD_CRASH_229. this is blocking my work
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: I changed my email address from sarah.k@oldomain.com to sarah.katherine@newdomain.com on my account three weeks ago but I'm still getting password reset emails sent to the old address. can you fix this?
  expected: '{"priority": "medium", "department": "technical", "urgency_score": 3}'
- input: 'ORDER #FS-334891 still hasn''t shipped and i ordered it on april 8th. your site said 1-2 business days for processing. its been 8 days. need tracking info asap.'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: Je suis preoccupe - j'ai vu une tentative de connexion a mon compte depuis une adresse IP en Roumanie le 22 avril a 19h45. J'habite en France. Est-ce qu'on a ete hacke? S'il vous plait repondez rapidement, j'ai des donnees financieres sensibles stockees ici.
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: Hi there, I'm hoping you can help me out. I've been a subscriber for about 8 months now and I really love the service, but I'm going on a 3-week trip to visit my family and I'd like to pause my account starting May 15th through June 5th. I don't want to cancel entirely because I plan to restart when I get back. I tried looking in my account settings but couldn't find a pause option anywhere. Could someone walk me through how to do this? Thanks so much!
  expected: '{"priority": "low", "department": "billing", "urgency_score": 2}'
- input: 'where is order #MK-887734??? ordered the italian pasta collection on april 18 with standard shipping and tracking says it left the warehouse on april 21 but its been sitting in memphis tennessee for 4 days now. i need this by this weekend for my dinner party. PLEASE HELP'
  expected: '{"priority": "high", "department": "general", "urgency_score": 4}'
- input: I'm writing to report a serious security concern. On April 23rd at approximately 11:47 PM, I received a login alert from an IP address (203.45.189.22) that I do not recognize, originating from Jakarta, Indonesia. I am currently located in Seattle and have never traveled there. I immediately changed my password, but I'm worried about what access this person may have had to my account and payment information. Please advise on what steps I should take next and whether my data has been compromised.
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: Do you offer gluten-free options? My daughter has celiac disease and I want to make sure before I sign up.
  expected: '{"priority": "medium", "department": "sales", "urgency_score": 3}'
- input: 'I was charged $84.99 on April 20th for my weekly meal plan renewal (Order #MK-556203), but I had already scheduled a skip week from April 20-26. The charge should not have gone through. This is the second time this has happened in the last two months and I''m frustrated. I need a refund processed immediately.'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: getting an error code E4012 whenever i try to load my meal preferences page. ive cleared my browser cache, tried incognito mode, and even switched to a different browser but still getting the same error. its been happening since yesterday morning and i cant update my allergies or dietary restrictions for next week's meals
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: Hi, I need to update the name on my account. I recently got married and changed my legal name from Jennifer Walsh to Jennifer Chen-Walsh, and I'd like all future correspondence and meal prep labels to reflect my new name. My account email is jen.walsh.meals@gmail.com and my customer ID is CUS-445821. Could you update this for me? Thanks!
  expected: '{"priority": "low", "department": "general", "urgency_score": 1}'
- input: Hola, tengo un problema con mi envío. El pedido número MK-778945 fue despachado el 19 de abril pero el rastreador dice que está perdido en tránsito. Ordené las comidas mediterráneas y estaban programadas para llegar el 21 de abril. Ya pasaron dos días y no ha llegado nada. ¿Pueden ayudarme a localizar el paquete o reenviar uno nuevo? Gracias.
  expected: '{"priority": "high", "department": "general", "urgency_score": 4}'
- input: Hi, I'm getting a 503 Service Unavailable error whenever I try to deploy my Node.js application to the us-east-2 region. This started happening around 2 PM today and my production environment is completely down. The error logs just show "Gateway timeout" with no additional details. Can someone look into this immediately?
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: I need to change the billing contact on my account from my old company email to my personal email. My account ID is ACC-294857 and the old email is billing@techcorp.net. Can you update this for me?
  expected: '{"priority": "low", "department": "billing", "urgency_score": 1}'
- input: 'Where''s my order? Ordered the networking cables on March 15th with 2-day shipping and it never showed up. Tracking #UPS8847291L just says "delivery attempted" but nobody came to my door.'
  expected: '{"priority": "high", "department": "general", "urgency_score": 4}'
- input: URGENT - I just noticed unauthorized API calls being made on my account this morning. Someone generated new credentials and made 47 requests to my database endpoints between 6-7 AM EST. My API key is still secure but the account shows login activity from 185.220.101.45 which is definitely not me. Please disable all access immediately and help me investigate.
  expected: '{"priority": "critical", "department": "technical", "urgency_score": 5}'
- input: Quick question - do you support webhook integrations with Zapier? I'm trying to set up automated notifications when my deployments complete but I'm not sure if your platform is compatible.
  expected: '{"priority": "medium", "department": "technical", "urgency_score": 3}'
- input: 'I was double-charged for my Developer Pro plan renewal on April 24th. Both charges of $299/month went through on the same day (invoice #INV-2847261 and INV-2847262). I only have one active subscription so I need one of these reversed ASAP.'
  expected: '{"priority": "high", "department": "billing", "urgency_score": 4}'
- input: estoy recibiendo un error de 'conexion perdida' cuando intento conectarme al servidor SFTP. hace 2 dias que esto ocurre. intente cambiar mi contraseña pero sigue el mismo problema. mi nombre de usuario es dev_carlos_23 y la conexion falla cuando llego al paso de autenticacion. necesito acceso urgente para subir archivos del cliente.
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
- input: my account got locked out after i typed the wrong password to many times. i havent been able to log in since yesterday afternoon around 4 PM. ive tried clicking the forgot password link but the reset email isnt showing up in my inbox or spam folder. can you unlock it so i can get back in? my email is james.morrison@consultancy.co
  expected: '{"priority": "high", "department": "technical", "urgency_score": 4}'
assertions:
- rule: regex_match
  pattern: ^\s*\{.*"priority".*"department".*"urgency_score".*\}\s*$
- rule: regex_match
  pattern: '"priority"\s*:\s*"(low|medium|high|critical)"'
- rule: regex_match
  pattern: '"department"\s*:\s*"(billing|technical|sales|general)"'
- rule: regex_match
  pattern: '"urgency_score"\s*:\s*[1-5]\b'
- rule: max_length
  value: 400
- rule: not_contains
  value: ERROR
fuzzing:
  inject_unicode: false
  empty_inputs: false
  whitespace_flood: false
  payload_extremes: false
