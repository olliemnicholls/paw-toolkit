task_name: region_code
spec: "Assign an internal region code to a sales message.\n\nEvery country we operate in belongs to exactly one internal region. The regions are an internal grouping: they are not continents, not trading blocs, and not anything you can work out from geography. The only way to get the answer right is to look the country up in the table below.\n\nThe table:\n\nRG-K7\n  Brazil\n  Vietnam\n  Thailand\n  Egypt\n  Sweden\n\nRG-M2\n  Kenya\n  Poland\n  Peru\n  Mexico\n  Malaysia\n\nRG-Q9\n  Norway\n  Chile\n  Australia\n  Nigeria\n  Indonesia\n\nRG-T4\n  Japan\n  Finland\n  Denmark\n  Argentina\n  Philippines\n\nRG-V1\n  Ireland\n  Turkey\n  India\n  Colombia\n  Greece\n\nRG-X6\n  Portugal\n  New Zealand\n  Canada\n  Morocco\n  Hungary\n\nThe input is a single short sentence from our order and support systems. It mentions exactly one of the thirty countries above, written out in full. It may also mention a city; the city is irrelevant, and it may well be a city in some other country. Match on the country name only. The country name may appear in lower case.\n\nOutput exactly one region code and nothing else: one of RG-K7, RG-M2, RG-Q9, RG-T4, RG-V1, RG-X6. No explanation, no punctuation, no country name.\n\nWorked example one. The input is \"Ship this order to Porto, Portugal.\" The country is Portugal. Portugal is listed under RG-X6. The output is RG-X6.\n\nWorked example two. The input is \"Our Osaka office handled the call, but the customer is in Kenya.\" Two places are mentioned, but Osaka is a city and Kenya is the country. Kenya is listed under RG-M2. The output is RG-M2.\n"
adapter_path: measurements/finetune_lookup_A-paw-4b-qwen3-0.6b.paw
