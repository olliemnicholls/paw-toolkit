[project]
name = "paw-kit"
version = "0.1.0"
description = "PAW compiles a spec into a tiny local model. paw-kit tells you whether you can trust the one you just made. Reliability and migration harness for Program-as-Weights (early alpha)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Oliver Nicholls", email = "O.Nicholls@imperial.ac.uk" },
]
# PEP 639: an SPDX expression plus the file, rather than the deprecated
# `license = {text = "MIT"}` table. This is why the hatchling floor below is 1.27.0 --
# earlier versions emit metadata 2.2 and reject the string form.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "paw",
    "program-as-weights",
    "llm",
    "local-inference",
    "lora",
    "pydantic",
    "structured-output",
    "fail-open",
    "llm-testing",
]
# Deliberately no "License :: OSI Approved :: MIT License" classifier: PyPI rejects a
# License classifier alongside a PEP 639 `license` expression, and the expression above
# is the authoritative declaration.
#
# "Development Status :: 3 - Alpha" is the honest rating and matches the README's own
# status box. It is not 4/Beta: the package has never been released, grammar-constrained
# decoding has been applied by a shipped backend and measured end to end on exactly two
# real adapters on one machine, and semantic correctness measured 60-90% depending on
# task. See `measurements/README.md` before raising this.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]

# PAW-DEPS-01: every runtime/optional/dev dependency below was previously floor-only
# (e.g. "pydantic>=2.6"), which lets `uv sync`/a fresh install silently resolve
# whatever major version happens to be latest on PyPI at install time -- including
# one released after this package, with breaking API changes or a compromised
# release, that nothing here has ever been tested against. Each ceiling below is one
# major version above the actual latest release as of 2026-09-06 (verified against
# PyPI, not guessed), except for 0.x packages, which get their ceiling at the next
# *minor* above the currently-tested release instead: semver treats a 0.x minor bump
# as potentially breaking, and several of these (fastapi, uvicorn, httpx, typer,
# interegular) have sat at 0.x for years with real behavioral changes across minors,
# so a same-major-version ceiling would be no ceiling in practice.
dependencies = [
    "pydantic>=2.6,<3.0.0",
    "typer>=0.12,<0.28.0",
    "pyyaml>=6.0,<7.0.0",
    # PAW-DEPS-03: interegular still parses `Field(pattern=...)` through its AST
    # (`grammar.py:38`), so it stays a dependency, but the algorithmic half of the
    # concern this ceiling was first argued against -- worst-case exponential DFA
    # state blowup -- is now closed differently than it was under Track 09's
    # PAW-SCHEMA-03 fix (`logits_processor.py`'s `_compile_fsm_safe`, deleted by
    # `constrained-decoding-real-backend`): the engine that walks the compiled
    # grammar (`paw_kit.schema.constraint`) is lazy and builds no DFA at all, so
    # there is no powerset construction here for a pathological pattern to blow up
    # -- and its `INITIAL_LEXER_FUEL` bound refuses an oversized grammar at
    # construction instead. This ceiling therefore remains the supply-chain half
    # only: an unbounded floor-only spec would still let a future interegular
    # release (compromised or merely incompatible) install silently.
    "interegular>=0.3.3,<0.4.0",
    "fastapi>=0.110.0,<0.142.0",
    "uvicorn>=0.28.0,<0.53.0",
    "httpx>=0.27.0,<0.29.0",
]

[project.urls]
Homepage = "https://github.com/olliemnicholls/paw-toolkit"
Repository = "https://github.com/olliemnicholls/paw-toolkit"
Issues = "https://github.com/olliemnicholls/paw-toolkit/issues"
Measurements = "https://github.com/olliemnicholls/paw-toolkit/blob/main/measurements/README.md"
"Upstream SDK" = "https://github.com/programasweights/programasweights-python"
"Paper (arXiv:2609.04199)" = "https://arxiv.org/abs/2609.04199"

[project.optional-dependencies]
# The official upstream SDK: the only dependency that yields a *working* real backend
# (`paw_kit.backend.programasweights.ProgramAsWeightsBackend`). It is imported lazily by
# that module, so paw-kit and its test suite run fine without it -- but nothing here
# previously declared it at all, so `pip install paw-kit[real]` installed PyTorch and left
# the backend that actually works uninstallable through package metadata.
#
# On public PyPI, despite the `--extra-index-url https://pypi.programasweights.com/simple/`
# in the upstream README: verified 2026-09-09 that `programasweights==0.4.4` resolves and
# installs from pypi.org alone (pulling llama-cpp-python, numpy, jinja2). No custom index
# needed. Floor is the version actually tested against; ceiling follows PAW-DEPS-01's 0.x
# convention (next *minor*, since a 0.x minor bump may break).
paw = [
    # Floor raised to 0.4.6 (PR #6): the version that added the public
    # `logits_processor` hook ProgramAsWeightsBackend.infer() now calls -- below it,
    # passing that kwarg to `function()`'s returned callable is a TypeError.
    "programasweights>=0.4.6,<0.5.0",
    # llguidance: the byte-level masking engine paw_kit.schema.constraint builds a
    # matcher from. PAW-DEPS-01: both bounds required.
    "llguidance>=1.8,<2",
    # numpy: llguidance's own bitmask helper (llguidance.numpy.apply_token_bitmask_inplace)
    # needs it declared explicitly, not just pulled in transitively via
    # llama-cpp-python -- PAW-DEPS-01 requires both bounds on every declared dependency,
    # and tests/test_pyproject_deps.py enforces it. 1.20 is llama-cpp-python's own
    # floor; verified against numpy 2.5.2 in this checkout.
    "numpy>=1.20,<3",
]
# `real` means "a backend that really runs a model", and that is the upstream SDK.
real = [
    "paw-kit[paw]",
]
# `paw-test judge`'s reference judge adapter (`paw_kit.test.judge.anthropic_judge`)
# imports `anthropic` lazily, so paw-kit and its own test suite run without it until
# `judge_cmd` is actually invoked -- but this project previously declared no version
# constraint on it anywhere, floor or ceiling, which is exactly how it shipped untested
# against `anthropic>=1.0`: that release dropped the typed `temperature` kwarg from
# `Messages.create()`, and every judge call raised `TypeError` before a request was
# ever sent (measurements/README.md, "Finetune compiler" section, "paw-test feedback"
# item 1). `anthropic_judge` now sends `temperature` via `extra_body` instead, which
# works on the wire on both sides of that break, so the floor below is `>=1.0`
# deliberately, not a pin away from it. Ceiling follows PAW-DEPS-01's convention: one
# major above the version actually verified working (1.4.0, as of 2026-09-10).
judge = [
    "anthropic>=1.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0.0",
    "pytest-cov>=4.0,<8.0.0",
]

[project.scripts]
paw-kit = "paw_kit.cli:app"
paw-test = "paw_kit.cli:test_app"
paw-inspect = "paw_kit.cli:inspect_cli"
paw-clean = "paw_kit.cli:clean_cli"
paw-serve = "paw_kit.cli:serve_cli"

[build-system]
# PAW-DEPS-02: previously completely unpinned. A PEP 517/518 build frontend creates an
# isolated build environment and fetches the latest hatchling release from PyPI on
# every build; hatchling isn't recorded in uv.lock either, so nothing else bounds
# which version actually runs. A verified, narrow range closes the "malicious/
# compromised release under the hatchling name executes arbitrary build hooks with
# the build runner's full privileges" vector without pinning to a single exact
# version (which would block routine patch upgrades).
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.12,<0.13"

