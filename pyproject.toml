[project]
name = "paw-kit"
version = "0.1.0"
description = "Production Runtime & Reliability Toolkit for Program-as-Weights (PAW)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "interegular>=0.3.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
paw-kit = "paw_kit.cli:app"
paw-test = "paw_kit.cli:test_app"
paw-inspect = "paw_kit.cli:inspect_cli"
paw-clean = "paw_kit.cli:clean_cli"
paw-serve = "paw_kit.cli:serve_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
