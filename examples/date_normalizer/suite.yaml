task_name: date_normalizer
spec: "Convert natural language date expressions into standard ISO-8601 YYYY-MM-DD format."
adapter_path: "examples/date_normalizer/.paw_demo_dates/date_normalizer.paw"

# Only a case with an `expected` value can be repaired by active learning: the loop never
# sends an input with no answer key to the teacher, because a label for it could not be
# checked against anything. The last three cases below are normalisation edge cases
# promoted from fuzz probes so that they carry an answer.
standard_cases:
  - input: "January 15, 2026"
    expected: "2026-01-15"
  - input: "2026/09/05"
    expected: "2026-09-05"
  - input: "December 31st, 2025"
    expected: "2025-12-31"
  - input: "2024-02-29"
    expected: "2024-02-29"
  - input: "  \t\n  2026-01-01  \n\t  "
    expected: "2026-01-01"
  - input: "2026年09月05日"
    expected: "2026-09-05"
  - input: "2026—12—31"
    expected: "2026-12-31"

assertions:
  - rule: "regex_match"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  - rule: "max_length"
    value: 10
  - rule: "min_length"
    value: 10
  - rule: "not_contains"
    value: "ERROR"

# Fuzz-generated cases are a robustness measurement, not something `auto_recompile` can
# repair: a mutation ("2026/09/05" with a zero-width space spliced in) has no answer key,
# so the loop reports how many such cases it declined to send to the teacher instead of
# asking a paid model to invent one. Expect this suite to fail against the mock adapter.
fuzzing:
  inject_unicode: true
  empty_inputs: false
  whitespace_flood: true
  payload_extremes: false

# abstain_value: "UNPARSEABLE"  # Uncomment to let a repaired model answer "no valid ISO
#   date exists" instead of being forced to invent one. Whitespace-only garbage inputs
#   have no legal date-shaped answer under the assertions above, so without this every
#   teacher label for them is rejected.

active_learning:
  auto_recompile: true
  teacher_model: "claude-3-5-sonnet-20241022"
  max_iterations: 3
